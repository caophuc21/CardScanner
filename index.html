<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4158D0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Smart Card Scanner</title>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; background-color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 32px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 9999;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <div style="width: 112px; height: 112px; background-color: #FAF7F2; border-radius: 24px; border: 1px solid #EAE5DD; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06); margin-bottom: 24px; overflow: hidden; padding: 12px;">
            <img src="/logo.png" alt="CardScanner Logo" style="width: 100%; height: 100%; object-fit: contain;" onError="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div style="display: none; flex-direction: column; align-items: center; justify-content: center; color: #C5A880;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
              </svg>
            </div>
          </div>
          <h1 style="font-size: 28px; font-weight: 800; color: #1c1917; margin: 0 0 8px 0; letter-spacing: -0.5px;">CardScanner</h1>
          <p style="font-size: 14px; font-weight: 500; color: #78716c; margin: 0;">Quét & Quản lý Danh thiếp Thông minh</p>
        </div>
        <div style="width: 100%; max-width: 200px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 32px;">
          <div style="width: 120px; height: 4px; background-color: #f5f5f4; border-radius: 9999px; overflow: hidden;">
            <div style="width: 60%; height: 100%; background-color: #C5A880; border-radius: 9999px; animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
          </div>
          <span style="font-size: 12px; color: #a8a29e; font-weight: 500;">Đang khởi động...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
